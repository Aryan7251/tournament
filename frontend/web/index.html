<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LuckyWin - Premier Gaming Tournaments and Aviator Arena">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LuckyWin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LuckyWin - Gaming & Esports Arena</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      background-color: #020617;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* iOS Safari / WebKit Input Reset for Flutter Web */
    input, textarea, select {
      -webkit-appearance: none !important;
      -moz-appearance: none !important;
      appearance: none !important;
      background-color: transparent !important;
      background: transparent !important;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      color: #ffffff !important;
      -webkit-text-fill-color: #ffffff !important;
    }
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px #0b1120 inset !important;
      -webkit-text-fill-color: #ffffff !important;
      transition: background-color 5000s ease-in-out 0s;
    }
    flt-glass-pane input {
      background: transparent !important;
      background-color: transparent !important;
      -webkit-appearance: none !important;
    }
    #app-loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #070B14;
      z-index: 999999;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    .loading-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .loading-icon-badge {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background-color: #0F172A;
      border: 1.5px solid #1E293B;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .loading-icon-badge svg {
      width: 32px;
      height: 32px;
      fill: #2ED573;
    }
    .loading-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2.5px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .loading-title-accent {
      color: #2ED573;
    }
    .loading-track {
      width: 140px;
      height: 3px;
      background-color: #1E293B;
      border-radius: 4px;
      margin-top: 12px;
      overflow: hidden;
      position: relative;
    }
    .loading-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background-color: #2ED573;
      border-radius: 4px;
      animation: flatBarAnim 1.2s ease-in-out infinite;
    }
    .loading-subtext {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: #64748B;
      margin-top: 10px;
    }
    @keyframes flatBarAnim {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 50%; }
      100% { left: 100%; width: 40%; }
    }
  </style>
</head>
<body>
  <!-- Flat Minimalist App Loading Screen -->
  <div id="app-loading-screen">
    <div class="loading-brand">
      <div class="loading-icon-badge">
        <svg viewBox="0 0 24 24">
          <path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 9 18.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
        </svg>
      </div>
      <div class="loading-title">
        <span>LUCKY</span><span class="loading-title-accent">WIN</span>
      </div>
      <div class="loading-track">
        <div class="loading-bar"></div>
      </div>
      <div class="loading-subtext">Loading arena...</div>
    </div>
  </div>

  <script>
    // Robust, fail-safe removal of loading screen
    (function() {
      let removed = false;
      function dismissLoader() {
        if (removed) return;
        removed = true;
        const loader = document.getElementById('app-loading-screen');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.pointerEvents = 'none';
          setTimeout(function() {
            try { loader.remove(); } catch(e) {}
          }, 350);
        }
      }

      // 1. Flutter native first frame event
      window.addEventListener('flutter-first-frame', dismissLoader);

      // 2. Observer for Flutter DOM elements
      const observer = new MutationObserver(function() {
        if (document.querySelector('flt-glass-pane') ||
            document.querySelector('flutter-view') ||
            document.querySelector('flt-scene-host') ||
            document.querySelector('canvas')) {
          setTimeout(dismissLoader, 150);
          try { observer.disconnect(); } catch(e) {}
        }
      });
      try {
        observer.observe(document.body, { childList: true, subtree: true });
      } catch(e) {}

      // 3. Fallback timeout: NEVER stay stuck on loading screen
      setTimeout(dismissLoader, 2200);
    })();

    // Web Audio Synthesizer for Games (Aviator, Mines, Lucky Wheel, Cyber Dice)
    (function() {
      let audioCtx = null;
      let engineOsc = null;
      let engineGain = null;
      let isMuted = false;

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      window.aviatorAudio = {
        setMuted: function(muted) {
          isMuted = !!muted;
          if (isMuted) {
            window.aviatorAudio.stopEngine();
          }
        },

        startEngine: function() {
          if (isMuted) return;
          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            window.aviatorAudio.stopEngine();

            engineOsc = ctx.createOscillator();
            engineGain = ctx.createGain();

            engineOsc.type = 'sawtooth';
            engineOsc.frequency.setValueAtTime(110, ctx.currentTime);

            // Lowpass filter for smooth engine rumble
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(320, ctx.currentTime);

            engineGain.gain.setValueAtTime(0.01, ctx.currentTime);
            engineGain.gain.linearRampToValueAtTime(0.06, ctx.currentTime + 0.3);

            engineOsc.connect(filter);
            filter.connect(engineGain);
            engineGain.connect(ctx.destination);

            engineOsc.start();
          } catch(e) {
            console.warn('Audio engine error:', e);
          }
        },

        updateEnginePitch: function(multiplier) {
          if (isMuted || !engineOsc || !audioCtx) return;
          try {
            const m = Math.max(1.0, multiplier);
            const freq = Math.min(650, 110 + (m - 1.0) * 45);
            engineOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.05);
          } catch(e) {}
        },

        stopEngine: function() {
          try {
            if (engineGain && audioCtx) {
              engineGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
            }
            if (engineOsc) {
              setTimeout(() => {
                try { engineOsc.stop(); engineOsc.disconnect(); } catch(_) {}
                engineOsc = null;
              }, 120);
            }
          } catch(e) {
            engineOsc = null;
          }
        },

        playCashout: function() {
          if (isMuted) return;
          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.07);

              gain.gain.setValueAtTime(0.12, ctx.currentTime + idx * 0.07);
              gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + idx * 0.07 + 0.25);

              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(ctx.currentTime + idx * 0.07);
              osc.stop(ctx.currentTime + idx * 0.07 + 0.3);
            });
          } catch(e) {}
        },

        playCrash: function() {
          if (isMuted) return;
          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            window.aviatorAudio.stopEngine();

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.4);

            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.45);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
          } catch(e) {}
        },

        playTick: function() {
          if (isMuted) return;
          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, ctx.currentTime);

            gain.gain.setValueAtTime(0.06, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.06);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.08);
          } catch(e) {}
        },

        playBet: function() {
          if (isMuted) return;
          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(800, ctx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.1);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.12);
          } catch(e) {}
        },

        // Mines Sounds
        playDiamond: function() {
          if (isMuted) return;
          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const notes = [880, 1318.51, 1760];
            notes.forEach((f, i) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.05);
              gain.gain.setValueAtTime(0.1, ctx.currentTime + i * 0.05);
              gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.05 + 0.18);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(ctx.currentTime + i * 0.05);
              osc.stop(ctx.currentTime + i * 0.05 + 0.2);
            });
          } catch(e) {}
        },

        playExplosion: function() {
          if (isMuted) return;
          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(25, ctx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.45);
          } catch(e) {}
        },

        // Wheel Sounds
        playWheelClick: function() {
          if (isMuted) return;
          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800 + Math.random() * 200, ctx.currentTime);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.03);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.04);
          } catch(e) {}
        },

        // Dice Sounds
        playDiceRoll: function() {
          if (isMuted) return;
          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            for (let i = 0; i < 4; i++) {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(300 + Math.random() * 400, ctx.currentTime + i * 0.05);
              gain.gain.setValueAtTime(0.05, ctx.currentTime + i * 0.05);
              gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.05 + 0.04);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(ctx.currentTime + i * 0.05);
              osc.stop(ctx.currentTime + i * 0.05 + 0.05);
            }
          } catch(e) {}
        },

        playWinFanfare: function() {
          if (isMuted) return;
          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
            notes.forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
              gain.gain.setValueAtTime(0.14, ctx.currentTime + idx * 0.08);
              gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + idx * 0.08 + 0.35);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(ctx.currentTime + idx * 0.08);
              osc.stop(ctx.currentTime + idx * 0.08 + 0.4);
            });
          } catch(e) {}
        },

        // Plinko Sounds
        playPlinkoBounce: function(pitchFactor) {
          if (isMuted) return;
          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const baseFreq = 540 + (typeof pitchFactor === 'number' ? pitchFactor * 35 : Math.random() * 80);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(baseFreq, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.7, ctx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.09, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.045);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.05);
          } catch(e) {}
        },

        playPlinkoSlot: function(multiplier) {
          if (isMuted) return;
          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const isHigh = (typeof multiplier === 'number' && multiplier >= 5.0);
            const notes = isHigh ? [440, 554.37, 659.25, 880, 1108.73] : [523.25, 659.25, 783.99];
            notes.forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.06);
              gain.gain.setValueAtTime(isHigh ? 0.15 : 0.10, ctx.currentTime + idx * 0.06);
              gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + idx * 0.06 + 0.25);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(ctx.currentTime + idx * 0.06);
              osc.stop(ctx.currentTime + idx * 0.06 + 0.3);
            });
          } catch(e) {}
        }
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
