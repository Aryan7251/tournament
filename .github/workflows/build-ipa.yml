name: Build Flutter iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate iOS scaffolding
        working-directory: frontend
        run: |
          if [ ! -d "ios" ]; then
            echo "Generating iOS platform files..."
            flutter create --platforms=ios --org com.luckywin.tournament .
          fi

      - name: Get dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build iOS (Release, No Codesign)
        working-directory: frontend
        run: flutter build ios --release --no-codesign --tree-shake-icons

      - name: Package into IPA
        working-directory: frontend
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qr tournament-release.ipa Payload
          ls -lh tournament-release.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tournament-release-ipa
          path: frontend/build/ios/ipa/tournament-release.ipa
          if-no-files-found: error
