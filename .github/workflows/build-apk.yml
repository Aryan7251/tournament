name: Build Flutter APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Release APK
        working-directory: frontend
        run: flutter build apk --release --tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-universal
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build Split-per-ABI APKs (Ultra Fast & Lightweight for Real Devices)
        working-directory: frontend
        run: flutter build apk --release --split-per-abi --tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Split APKs (arm64-v8a, armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-split-abis
          path: frontend/build/app/outputs/flutter-apk/app-*.apk
          if-no-files-found: error

